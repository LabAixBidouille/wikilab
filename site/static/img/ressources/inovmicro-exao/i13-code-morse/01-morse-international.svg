  <g transform="translate(20, 630)" font-size="12" fill="#333">
    <text x="0" y="12">• Point = 1 unité de durée</text>
    <text x="0" y="30">• Tiret = 3 unités</text>
    <text x="0" y="48">• Silence entre deux signaux d'une même lettre = 1 unité</text>
    <text x="320" y="12">• Silence entre deux lettres = 3 unités</text>
    <text x="320" y="30">• Silence entre deux mots = 7 unités</text>
