<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">Le jeton suivant : probabilités et tickets de loterie</title>
<desc id="d">Après « To put out a campfire, pour », le modèle donne water 82,2 %, puis a 3,1 %, (un espace) 2,4 %, soil 2,4 %, sand 1,6 %, cold 1,3 %, et 7,0 % pour tous les autres jetons. Les mêmes parts en 100 tickets de loterie : 82 pour water, 11 pour les cinq jetons suivants, 7 pour tous les autres. Ollama tire un ticket.</desc>
