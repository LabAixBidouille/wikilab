<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" width="900" height="446" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">Ce qu'une fenêtre garde d'un texte de 4 122 jetons</title>
<desc id="d">Deux barres à l'échelle, sauf les 4 premiers jetons, dessinés plus larges, pour le même texte de 4 122 jetons avec trois mots de code. Avec une fenêtre de 8192, tout le texte est gardé et les trois mots sont trouvés. Avec une fenêtre de 2048, seuls les 4 premiers jetons et les 1 022 derniers restent, 1 026 en tout, environ la moitié de la fenêtre ; 3 096 jetons entre les deux sont retirés. TULIP vient juste après les 4 premiers : TULIP et OTTER sont donc perdus, et MAPLE est trouvé.</desc>
<defs>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="10" stroke="#9aa3af" stroke-width="3"/></pattern>
</defs>
<rect x="0" y="0" width="900" height="446" fill="#ffffff"/>
<text x="30" y="28" font-size="17" fill="#1f2a37"><tspan font-weight="bold">Fenêtre de 8192</tspan> : les 4 122 jetons sont gardés</text>
<rect x="30" y="86" width="840" height="40" fill="#2a6fa8"/>
<text x="30" y="70" font-size="16" fill="#1f2a37"><tspan font-weight="bold">TULIP</tspan> : trouvé</text>
<path d="M48 80L48 126" fill="none" stroke="#c8602a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="70" font-size="16" fill="#1f2a37" text-anchor="middle"><tspan font-weight="bold">OTTER</tspan> : trouvé</text>
<path d="M450 80L450 126" fill="none" stroke="#c8602a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="870" y="70" font-size="16" fill="#1f2a37" text-anchor="end"><tspan font-weight="bold">MAPLE</tspan> : trouvé</text>
<path d="M868 80L868 126" fill="none" stroke="#c8602a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="172" font-size="17" fill="#1f2a37"><tspan font-weight="bold">Fenêtre de 2048</tspan> : seuls 1 026 des 4 122 jetons sont gardés</text>
<rect x="30" y="230" width="840" height="40" fill="url(#hatch)"/>
<rect x="30" y="230" width="9" height="40" fill="#2a6fa8"/>
<rect x="661.73" y="230" width="208.27" height="40" fill="#2a6fa8"/>
<rect x="30" y="230" width="840" height="40" fill="none" stroke="#9aa3af" stroke-width="1"/>
<text x="30" y="214" font-size="16" fill="#1f2a37"><tspan font-weight="bold">TULIP</tspan> : perdu</text>
<path d="M48 224L48 270" fill="none" stroke="#c8602a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="450" y="214" font-size="16" fill="#1f2a37" text-anchor="middle"><tspan font-weight="bold">OTTER</tspan> : perdu</text>
<path d="M450 224L450 270" fill="none" stroke="#c8602a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="870" y="214" font-size="16" fill="#1f2a37" text-anchor="end"><tspan font-weight="bold">MAPLE</tspan> : trouvé</text>
<path d="M868 224L868 270" fill="none" stroke="#c8602a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M34.5 270L34.5 294" fill="none" stroke="#2a6fa8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="312" font-size="15" fill="#1f2a37">4 premiers jetons : gardés</text>
<text x="30" y="330" font-size="15" fill="#4b5563">(dessinés plus larges)</text>
<path d="M57 280L57 288L659.73 288L659.73 280" fill="none" stroke="#9aa3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="358.37" y="312" font-size="15" fill="#1f2a37" text-anchor="middle">3 096 jetons retirés</text>
<path d="M661.73 280L661.73 288L870 288L870 280" fill="none" stroke="#2a6fa8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="870" y="312" font-size="15" fill="#1f2a37" text-anchor="end">1 022 derniers jetons : gardés</text>
<path d="M452.65 338L452.65 348L870 348L870 338" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="870" y="370" font-size="15" fill="#1f2a37" text-anchor="end">taille de la fenêtre : 2 048 jetons, à la même échelle</text>
<text x="30" y="370" font-size="15" fill="#1f2a37" font-weight="bold">Gardés : 1 026, environ la</text>
<text x="30" y="390" font-size="15" fill="#1f2a37" font-weight="bold">moitié de la fenêtre.</text>
</svg>
